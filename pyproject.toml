[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "upwork-mcp-job-alert-automation"
version = "0.1.0"
description = "Triage official Upwork job-alert emails before a manual MCP review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mujtaba Shamas" }]
dependencies = [
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "google-auth-oauthlib>=1.2,<2",
  "openai>=1.65,<3",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
upwork-alert-triage = "upwork_alerts.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

